<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ULLAH</title>
<style>
  :root { --bg:#0b0f1a; --panel:#121826; --panel2:#1a2233; --fg:#e6edf7; --mut:#8b97ad; --acc:#5b8cff; --user:#264a8a; --bot:#1a2233; --code:#0d1117; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid #222c3f; position:sticky; top:0; z-index:10; }
  header .logo { font-weight:700; font-size:18px; letter-spacing:.5px; }
  header .logo span { color:var(--acc); }
  select { background:var(--panel2); color:var(--fg); border:1px solid #2b3952; border-radius:8px; padding:7px 10px; font-size:13px; max-width:42vw; }
  button { background:var(--panel2); color:var(--fg); border:1px solid #2b3952; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:active { background:#233046; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .spacer { flex:1; }
  #chat { flex:1; overflow-y:auto; padding:14px 12px 6px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:14px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--bot); border:1px solid #26324a; border-bottom-left-radius:4px; }
  .msg.bot .role { color:var(--acc); font-size:12px; font-weight:700; margin-bottom:4px; }
  .msg.err { background:#3a1420; border:1px solid #7a2233; color:#ffb3c0; align-self:center; font-size:13px; }
  pre { background:var(--code); border:1px solid #26324a; border-radius:10px; padding:10px; margin:8px 0 2px; overflow-x:auto; position:relative; white-space:pre; }
  pre code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
  .copybtn { position:absolute; top:6px; right:6px; font-size:11px; padding:3px 8px; background:#1f2b3f; }
  footer { padding:8px 10px; background:var(--panel); border-top:1px solid #222c3f; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--panel2); color:var(--fg); border:1px solid #2b3952; border-radius:10px; padding:10px; font-size:15px; font-family:inherit; max-height:120px; min-height:44px; }
  .cursor::after { content:"▋"; color:var(--acc); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .hint { color:var(--mut); font-size:12px; text-align:center; padding:6px; }
  #voicebar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid #222c3f; flex-wrap:wrap; }
  #voicebar button { padding:7px 11px; }
  #mic.listening { background:#7a2233; border-color:#b0304a; color:#fff; animation:pulse 1.3s infinite; }
  @keyframes pulse { 50% { opacity:.65; } }
  #mic:disabled { opacity:.45; }
  .toggle.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .convlabel { font-size:13px; color:var(--mut); display:flex; align-items:center; gap:5px; }
  #vstatus { color:var(--mut); font-size:12px; }
  #transcript { min-height:0; padding:0 12px; color:var(--acc); font-size:14px; }
  #transcript:not(:empty) { padding:6px 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">UL<span>LAH</span></div>
  <div class="spacer"></div>
  <select id="model" title="Model"></select>
  <button id="newchat">New chat</button>
</header>

<div id="voicebar">
  <button id="mic" title="Bolna">🎙 Mic</button>
  <button id="lang" class="toggle" title="Hindi / English">hi-IN</button>
  <button id="stopspk" title="Stop speaking">⏹ Stop</button>
  <label class="convlabel"><input type="checkbox" id="conv" /> Baat-cheet loop</label>
  <div class="spacer"></div>
  <span id="vstatus">voice ready</span>
</div>
<div id="transcript"></div>

<div id="chat"></div>
<div class="hint" id="hint">Hinglish coding agent — poocho kuch bhi</div>
<footer>
  <textarea id="input" rows="1" placeholder="Apna sawaal likho..."></textarea>
  <button id="send" class="primary">Send</button>
</footer>
<script src="./app.js"></script>
<script src="./voice.js"></script>
</body>
</html>
